ext {
    // v.1.4.3 gelombang 5: Play menolak unggahan AAB — "Perlindungan otomatis Google Play
    //   memerlukan versi SDK minimum 24". Angka 23 ini warisan Capacitor 7; Capacitor 8
    //   sendiri sudah memakai 24 sebagai default (@capacitor/android capacitor/build.gradle
    //   dan capacitor-cordova-android-plugins keduanya jatuh ke 24 bila properti tak diset),
    //   jadi 23 justru menahan proyek di bawah default kerangkanya sendiri.
    //   Konsekuensinya: Android 6.0 (Marshmallow, rilis 2015) tak lagi didukung; minimum
    //   naik ke Android 7.0 Nougat. Bila suatu saat perangkat Android 6 harus dilayani lagi,
    //   jalan lain adalah mematikan Perlindungan Otomatis di Play Console, bukan menurunkan
    //   angka ini sendirian — Play akan menolak unggahannya lagi.
    minSdkVersion = 24
    // v.1.2.1: Play mewajibkan target Android 16 (API 36) — tenggat 31 Agu 2026.
    //   Capacitor 8.4.2 SUDAH default ke 36; berkas inilah yang menahannya di 35.
    //   Perubahan perilaku Android 16 yang menyala saat target 36, sudah dicek:
    //     - edge-to-edge dipaksa: styles.xml tak punya windowOptOutEdgeToEdgeEnforcement,
    //       dan edge-to-edge penuh sudah dipasang sejak v.1.1.x → aman.
    //     - predictive back menyala default: @capacitor/app memakai
    //       OnBackPressedDispatcher (AndroidX), bukan onBackPressed() lawas → listener
    //       'backButton' tetap terpanggil.
    //     - kunci orientasi diabaikan di layar besar: manifest memang tak mengunci
    //       screenOrientation → tak ada yang berubah.
    compileSdkVersion = 36
    targetSdkVersion = 36
    androidxActivityVersion = '1.9.2'
    androidxAppCompatVersion = '1.7.0'
    androidxCoordinatorLayoutVersion = '1.2.0'
    androidxCoreVersion = '1.15.0'
    androidxFragmentVersion = '1.8.4'
    coreSplashScreenVersion = '1.0.1'
    androidxWebkitVersion = '1.12.1'
    junitVersion = '4.13.2'
    androidxJunitVersion = '1.2.1'
    androidxEspressoCoreVersion = '3.6.1'
    cordovaAndroidVersion = '10.1.1'
    // v.108: aktifkan dependensi Google Sign-In utk @capacitor-firebase/authentication.
    //   Tanpa flag ini, deps Google cuma compileOnly → runtime crash saat signInWithGoogle.
    rgcfaIncludeGoogle = true
}