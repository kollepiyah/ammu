    <script>
      // Alihkan otomatis URL lama Firebase (.web.app / .firebaseapp.com) ke domain resmi ammu.almanshur.id.
      // Aman: tidak berjalan di Capacitor Android, Electron, file statis (privacy.html/app-version.json),
      // maupun saat sedang menyelesaikan callback OAuth (?code=).
      ;(function () {
        try {
          var h = (window.location.hostname || '').toLowerCase()
          if (h !== 'ammuonline.web.app' && h !== 'ammuonline.firebaseapp.com') return
          if (
            window.Capacitor &&
            window.Capacitor.isNativePlatform &&
            window.Capacitor.isNativePlatform()
          )
            return
          if (/Electron/i.test(navigator.userAgent || '')) return
          if (/[?&]code=/.test(window.location.search || '')) return
          window.location.replace(
            'https://ammu.almanshur.id' +
              (window.location.pathname || '/') +
              (window.location.search || '') +
              (window.location.hash || '')
          )
        } catch (e) {}
      })()
    </script>

    <script>
      // v.84.0526: Apply dark mode EARLY supaya splash ikut tema user.
      // Batch 2 (26 Nov 2026): samakan meta theme-color dengan warna splash sejak detik 0
      // supaya status bar atas di PWA iOS (iOS 26 edge tint) tak bocor warna hijau #0f766e
      // di atas splash gelap/terang. Dikembalikan ke #0f766e di main.js saat splash mulai hilang.
      ;(function () {
        try {
          var otomatis = localStorage.getItem('portalMu_temaMode') === 'otomatis'
          var gelap = otomatis
            ? window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches
            : localStorage.getItem('portalMu_darkMode') === '1'
          var metaTema = document.querySelector('meta[name="theme-color"]')
          if (metaTema) metaTema.setAttribute('content', gelap ? '#0c0e12' : '#f2fef9')
          if (gelap) {
            document.documentElement.classList.add('dark')
            document.addEventListener('DOMContentLoaded', function () {
              document.body && document.body.classList.add('dark-mode')
            })
          }
        } catch (e) {}
      })()
    </script>
    <style>
      /* v.91.0626 FIX (compact + anti-gepeng): splash DISUSUN dari logo (bukan 1 gambar full-bleed
         yang ke-stretch/crop di rasio layar tertentu). Logo di tengah + "Powered by Bakafrawi" di
         bawah, flex-center di atas bg solid -> TAK PERNAH gepeng di device mana pun, ringan
         (drop 4 PNG splash ~370KB dari web load), tampilan tetap seperti splash.png. */
      #splash-screen {
        position: fixed;
        inset: 0;
        /* Turun melewati dasar viewport: menutup celah bug iOS 26 PWA saat splash tampil. */
        bottom: calc(-1 * env(safe-area-inset-bottom, 0px));
        z-index: 99999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background-color: #f2fef9;
        opacity: 1;
        /* v.1.5.2: JANGAN pakai animation splashFadeIn (opacity 0 -> 1) di tirai luar #splash-screen,
           karena 0.4s pertama bikin teks statis Google OAuth di #app tembus berkedip saat hard refresh.
           Animasi cukup pada .splash-logo & .splash-brand di dalamnya. */
        padding: env(safe-area-inset-top) env(safe-area-inset-right)
          calc(2 * env(safe-area-inset-bottom, 0px)) env(safe-area-inset-left);
        box-sizing: border-box;
      }
      /* Batch 2 (26 Nov 2026): logo & footer LANGSUNG tampil sejak HTML diterima (tanpa menunggu
         JS menambahkan .reveal), sehingga saat WebView/jaringan sedang memuat, pengguna langsung
         melihat splash berlogo — bukan layar kosong polos. */
      #splash-screen .splash-logo {
        position: absolute;
        top: 45%;
        left: 50%;
        transform: translate(-50%, -50%) scale(1);
        width: 30vw;
        max-width: 120px;
        min-width: 92px;
        height: auto;
        object-fit: contain;
        -webkit-user-drag: none;
        user-select: none;
        opacity: 1;
        animation: splashLogoIn 0.65s cubic-bezier(0.33, 0, 0.2, 1) forwards;
      }
      #splash-screen .splash-brand {
        position: absolute;
        left: 0;
        right: 0;
        bottom: calc(2 * env(safe-area-inset-bottom, 0px) + 22px);
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 4px;
        opacity: 0;
        animation: splashFadeIn 0.45s 0.2s ease-out forwards;
      }
      #splash-screen .splash-brand-by {
        font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
        font-size: 12px;
        font-weight: 600;
        letter-spacing: 0.05em;
        color: #94a3b8;
      }
      /* v.91.0626: footer Bakafrawi (gambar lengkap "Powered by") — height:auto jaga rasio (anti-gepeng) */
      #splash-screen .splash-brand-img {
        display: block;
        width: 108px;
        max-width: 36vw;
        height: auto;
        object-fit: contain;
        -webkit-user-drag: none;
        user-select: none;
      }
      body.dark-mode #splash-screen,
      html.dark #splash-screen {
        background-color: #0c0e12;
      }
      body.dark-mode #splash-screen .splash-brand-by,
      html.dark #splash-screen .splash-brand-by {
        color: #94a3b8;
      }
      body.dark-mode #splash-screen .splash-brand-img,
      html.dark #splash-screen .splash-brand-img {
        filter: brightness(1.12);
      }
      /* v.87.0526: fade-out pakai animation forwards supaya MENANG atas fill-mode 'both'. */
      #splash-screen.fade-out {
        animation: splashFadeOut 0.35s ease-out forwards;
        pointer-events: none;
      }
      @keyframes splashFadeIn {
        0% {
          opacity: 0;
        }
        100% {
          opacity: 1;
        }
      }
      @keyframes splashFadeOut {
        0% {
          opacity: 1;
        }
        100% {
          opacity: 0;
        }
      }
      @keyframes splashLogoIn {
        0% {
          opacity: 0.92;
          transform: translate(-50%, -50%) scale(0.92);
        }
        100% {
          opacity: 1;
          transform: translate(-50%, -50%) scale(1);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #splash-screen .splash-logo,
        #splash-screen .splash-brand {
          opacity: 1 !important;
          animation: none !important;
        }
      }
      body.app-running #splash-screen {
        display: none !important;
      }
    </style>
